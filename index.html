<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onboarding Demo Shop</title>
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('onboarding-demo-theme');
        } catch (e) {
          stored = null;
        }
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var mode = stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', mode);
        document.documentElement.style.colorScheme = mode;
        if (mode === 'dark') {
          // Keep in sync with palettes.dark in src/theme.ts; ThemeProvider re-applies these on mount.
          var dark = {
            '--color-background': '#151413',
            '--color-surface': '#1F1E1C',
            '--color-surface-alt': '#2A2826',
            '--color-text': '#F5F3F0',
            '--color-text-secondary': '#B0ADA8',
            '--color-text-muted': '#8A8782',
            '--color-primary': '#E88F76',
            '--color-primary-hover': '#F0A48D',
            '--color-primary-surface': '#3A2A25',
            '--color-on-primary': '#1A1A1A',
            '--color-success': '#7FB08D',
            '--color-success-surface': '#23342A',
            '--color-error': '#E2695B',
            '--color-error-surface': '#3A2320',
            '--color-border': '#3A3835',
            '--color-border-light': '#2E2C29',
            '--color-inverse-surface': '#F5F3F0',
            '--color-inverse-text': '#1A1A1A',
            '--color-shadow': 'rgba(0, 0, 0, 0.5)'
          };
          Object.keys(dark).forEach(function (key) {
            document.documentElement.style.setProperty(key, dark[key]);
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
