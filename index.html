<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onboarding Demo Shop</title>
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('onboarding-demo-theme');
        } catch (e) {
          stored = null;
        }
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var mode = stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', mode);
        document.documentElement.style.colorScheme = mode;
        if (mode === 'dark') {
          document.documentElement.style.setProperty('--color-background', '#151413');
          document.documentElement.style.setProperty('--color-text', '#F5F3F0');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
